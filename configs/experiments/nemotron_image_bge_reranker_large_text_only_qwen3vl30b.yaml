experiment_name: nemotron_image_bge_reranker_large_text_only_qwen3vl30b
results_root: results
seed: 42

dataset:
  name: docbench
  split: multimodal_308
  subset: multimodal-t,multimodal-f
  types: ["multimodal-t", "multimodal-f"]
  data_dir: data/datasets/docbench

# Controlled comparison with text_reranker_308_bge_large_qwen3vl30b.yaml:
# only candidate generation differs (Nemotron image retrieval instead of BM25).
evaluation:
  evaluator: text_reranker_308

retrieval:
  mode: nemotron_image
  backend: nemotron_image
  model_id: models/nemotron/embed-vl-1b-v2
  index_dir: index
  index_name: nemotron
  device: cuda
  first_stage_top_k: 30

reranking:
  mode: text_cross_encoder
  backend: cross_encoder
  model_id: BAAI/bge-reranker-large
  device: cuda
  top_k: 10
  batch_size: 4
  max_length: 512
  trust_remote_code: true

text_pipeline:
  source_fields: ["page_text"]
  context_top_pages: 5
  text_context_max_chars: 32000

generation:
  model_id: openai/qwen3-vl-30b
  prompt_profile: docbench_hybrid_v1
  multimodal_generation_backend: openai_compatible_vlm
  max_new_tokens: 192
  openai_vlm:
    base_url: "http://10.32.15.88:4000/v1"
    model: "openai/qwen3-vl-30b"
    api_key_env: "OPENAI_COMPAT_API_KEY"
    temperature: 0
    max_tokens: 192
    timeout: 180

output:
  directory: results/nemotron_image_bge_reranker_large_text_only_qwen3vl30b
